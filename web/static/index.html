<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史比赛 — Dota 2 Predictor</title>
<script>
  if (window.location.protocol === "file:") {
    window.location.replace("http://127.0.0.1:8000/matches");
  }
</script>
<style>
  :root {
    color-scheme: dark;
    font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    --bg: #0b1014;
    --surface: #11181e;
    --surface-raised: #172128;
    --surface-hover: #1b272f;
    --border: #2b3841;
    --border-strong: #43535e;
    --text: #f2f6f8;
    --muted: #b5c0c8;
    --dim: #91a0aa;
    --accent: #61cec1;
    --accent-soft: rgba(97, 206, 193, .12);
    --link: #84b8ff;
    --radiant: #a9dc7e;
    --dire: #ff967f;
    --critical: #ef858b;
    --radius: 10px;
    --shadow: 0 18px 50px rgba(0, 0, 0, .18);
    --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-width: 320px; background: var(--bg); color: var(--text); font-size: 14px; }
  button, input { font: inherit; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border);
    background: rgba(11, 16, 20, .94);
    backdrop-filter: blur(12px);
  }
  .site-header-inner {
    display: flex;
    max-width: 1440px;
    min-height: 64px;
    margin: 0 auto;
    padding: 8px 24px;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    display: grid;
    width: 36px;
    height: 36px;
    place-items: center;
    border: 1px solid #3d817a;
    border-radius: 9px;
    color: var(--accent);
    background: var(--accent-soft);
    font-family: var(--mono);
    font-weight: 800;
  }
  .brand-copy { display: grid; min-width: 0; }
  .brand-copy strong { font-size: 14px; }
  .brand-copy span { color: var(--dim); font-size: 11px; }
  .nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .nav a {
    padding: 8px 10px;
    border-radius: 7px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }
  .nav a:hover { color: var(--text); background: var(--surface-raised); text-decoration: none; }
  .nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

  .safety-strip {
    border-bottom: 1px solid #4b462b;
    background: linear-gradient(90deg, rgba(217, 173, 85, .12), rgba(217, 173, 85, .04));
  }
  .safety-strip > div {
    display: flex;
    max-width: 1440px;
    min-height: 38px;
    margin: 0 auto;
    padding: 7px 24px;
    align-items: center;
    gap: 10px;
    color: #ddc58d;
    font-size: 12px;
  }
  .safety-strip strong { color: #f0d590; letter-spacing: .04em; }

  .page-shell { max-width: 1440px; margin: 0 auto; padding: 34px 24px 64px; }
  .page-heading { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 22px; }
  .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(26px, 3vw, 36px); letter-spacing: -.025em; }
  .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .page-note { max-width: 420px; color: var(--dim); font-size: 12px; line-height: 1.55; text-align: right; }

  .filters {
    display: grid;
    grid-template-columns: repeat(4, minmax(130px, 1fr)) auto;
    gap: 12px;
    align-items: end;
    margin-bottom: 18px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .field { display: grid; gap: 6px; }
  .field label { color: var(--muted); font-size: 12px; font-weight: 600; }
  .field input {
    width: 100%;
    min-height: 38px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    background: var(--surface-raised);
  }
  .field input:hover { border-color: var(--border-strong); }
  .field input:focus { border-color: var(--accent); }
  .primary-button {
    min-height: 38px;
    padding: 8px 18px;
    border: 1px solid #4ca99e;
    border-radius: 7px;
    color: #071411;
    background: var(--accent);
    font-weight: 700;
    cursor: pointer;
  }
  .primary-button:hover { filter: brightness(1.07); }

  .content-card {
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 900px; }
  th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); text-align: left; }
  th {
    position: sticky;
    top: 0;
    z-index: 1;
    color: var(--dim);
    background: #10171c;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .055em;
    text-transform: uppercase;
  }
  td { color: var(--muted); font-size: 13px; }
  tbody tr:hover td { background: var(--surface-hover); }
  tbody tr:last-child td { border-bottom: 0; }
  .match-link { font-family: var(--mono); font-size: 12px; }
  .radiant { color: var(--radiant); font-weight: 600; }
  .dire { color: var(--dire); font-weight: 600; }
  .winner { display: inline-flex; padding: 3px 8px; border: 1px solid currentColor; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .mono { font-family: var(--mono); font-size: 12px; }

  .state {
    display: grid;
    min-height: 220px;
    place-items: center;
    padding: 34px;
    color: var(--muted);
    text-align: center;
  }
  .state strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 15px; }
  .state.error { color: #efb0b4; background: rgba(224, 118, 124, .06); }

  .pagination {
    display: flex;
    min-height: 54px;
    padding: 10px 14px;
    align-items: center;
    justify-content: flex-end;
    gap: 7px;
    border-top: 1px solid var(--border);
  }
  .pagination button {
    min-height: 32px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    background: var(--surface-raised);
    cursor: pointer;
  }
  .pagination button:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); }
  .pagination button:disabled { opacity: .4; cursor: default; }
  .pagination span { margin-right: auto; color: var(--dim); font-size: 12px; }

  @media (max-width: 900px) {
    .site-header-inner { align-items: flex-start; flex-direction: column; gap: 6px; }
    .nav { width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
    .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .primary-button { grid-column: 1 / -1; }
    .page-heading { align-items: flex-start; flex-direction: column; }
    .page-note { text-align: left; }
  }

  @media (max-width: 640px) {
    .site-header-inner, .safety-strip > div, .page-shell { padding-inline: 14px; }
    .page-shell { padding-top: 24px; }
    .brand-copy span { display: none; }
    .filters { grid-template-columns: 1fr; padding: 12px; }
    .primary-button { grid-column: auto; }
    .content-card { border-radius: 8px; }
    .table-scroll { overflow: visible; }
    table, thead, tbody, tr, th, td { display: block; min-width: 0; }
    thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    tbody { display: grid; gap: 10px; padding: 10px; }
    tbody tr { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-raised); }
    tbody tr:hover td { background: transparent; }
    td {
      display: grid;
      grid-template-columns: minmax(94px, .8fr) minmax(0, 1.4fr);
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(67, 83, 94, .55);
      font-size: 13px;
    }
    td:last-child { border-bottom: 0; }
    td::before { content: attr(data-label); color: var(--dim); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .pagination { flex-wrap: wrap; justify-content: flex-start; }
    .pagination span { width: 100%; margin: 0 0 4px; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="/monitor" aria-label="打开 Dota 2 滚球监控台">
      <span class="brand-mark" aria-hidden="true">D2</span>
      <span class="brand-copy"><strong>Dota 2 Predictor</strong><span>本地分析与纸面决策工具</span></span>
    </a>
    <nav class="nav" aria-label="主要页面">
      <a href="/monitor">滚球监控</a>
      <a href="/matches" aria-current="page">历史比赛</a>
      <a href="/prematch">赛前预测</a>
      <a href="/monitor?view=intelligence">赛后情报</a>
    </nav>
  </div>
</header>
<div class="safety-strip"><div><strong>PAPER / ANALYSIS ONLY</strong><span>本页面只读取历史比赛数据，不提供真实下注操作。</span></div></div>

<main class="page-shell">
  <header class="page-heading">
    <div>
      <p class="eyebrow">Historical matches</p>
      <h1>历史比赛</h1>
      <p class="subtitle">检索已入库的职业比赛，并快速核对胜负、比分与赛事信息。</p>
    </div>
    <p class="page-note">比赛 ID 会打开原始 API 记录；本页不会修改数据库，也不会触发模型或采集任务。</p>
  </header>

  <form class="filters" id="filters-form">
    <div class="field"><label for="team-id">队伍 ID</label><input id="team-id" type="number" inputmode="numeric" placeholder="全部队伍"></div>
    <div class="field"><label for="league-id">联赛 ID</label><input id="league-id" type="number" inputmode="numeric" placeholder="全部联赛"></div>
    <div class="field"><label for="date-from">开始日期</label><input id="date-from" type="date"></div>
    <div class="field"><label for="date-to">结束日期</label><input id="date-to" type="date"></div>
    <button class="primary-button" type="submit">应用筛选</button>
  </form>

  <section class="content-card" id="content" aria-live="polite" aria-busy="true">
    <div class="state"><div><strong>正在加载比赛</strong><span>请稍候</span></div></div>
  </section>
</main>

<script>
const BASE = '/api/matches';
let page = 1;

function formatDuration(seconds) {
  if (!Number.isFinite(Number(seconds))) return '—';
  const total = Number(seconds);
  const minutes = Math.floor(total / 60);
  const remainder = total % 60;
  return `${minutes}:${String(remainder).padStart(2, '0')}`;
}

function formatDate(timestamp) {
  if (!timestamp) return '—';
  return new Date(Number(timestamp) * 1000).toLocaleDateString('zh-CN');
}

function buildURL() {
  const params = new URLSearchParams({ page: String(page), page_size: '20' });
  const teamId = document.getElementById('team-id').value;
  const leagueId = document.getElementById('league-id').value;
  const dateFrom = document.getElementById('date-from').value;
  const dateTo = document.getElementById('date-to').value;
  if (teamId) params.set('team_id', teamId);
  if (leagueId) params.set('league_id', leagueId);
  if (dateFrom) params.set('date_from', String(Math.floor(new Date(`${dateFrom}T00:00:00`).getTime() / 1000)));
  if (dateTo) params.set('date_to', String(Math.floor(new Date(`${dateTo}T23:59:59`).getTime() / 1000)));
  return `${BASE}?${params.toString()}`;
}

function element(tag, options = {}) {
  const node = document.createElement(tag);
  if (options.className) node.className = options.className;
  if (options.text != null) node.textContent = String(options.text);
  if (options.attrs) Object.entries(options.attrs).forEach(([name, value]) => node.setAttribute(name, String(value)));
  return node;
}

function stateView(title, message, isError = false) {
  const state = element('div', { className: `state${isError ? ' error' : ''}` });
  const copy = element('div');
  copy.append(element('strong', { text: title }), element('span', { text: message }));
  state.append(copy);
  return state;
}

async function loadMatches() {
  const content = document.getElementById('content');
  content.setAttribute('aria-busy', 'true');
  content.replaceChildren(stateView('正在加载比赛', '请稍候'));
  try {
    const response = await fetch(buildURL(), { headers: { Accept: 'application/json' } });
    if (!response.ok) throw new Error((await response.text()) || `请求失败 (${response.status})`);
    renderMatches(await response.json());
  } catch (error) {
    content.replaceChildren(stateView('比赛加载失败', error instanceof Error ? error.message : '未知错误', true));
  } finally {
    content.setAttribute('aria-busy', 'false');
  }
}

function addCell(row, label, value, className = '') {
  const cell = element('td', { className, attrs: { 'data-label': label } });
  if (value instanceof Node) cell.append(value);
  else cell.textContent = value == null || value === '' ? '—' : String(value);
  row.append(cell);
}

function renderMatches(payload) {
  const content = document.getElementById('content');
  const matches = Array.isArray(payload.data) ? payload.data : [];
  if (matches.length === 0) {
    content.replaceChildren(stateView('没有符合条件的比赛', '可调整筛选条件，或先运行数据抓取模块。'));
    return;
  }

  const scroll = element('div', { className: 'table-scroll' });
  const table = element('table');
  const head = element('thead');
  const headRow = element('tr');
  ['比赛 ID', 'Radiant', 'Dire', '胜方', '比分', '时长', '赛事', '日期'].forEach((label) => headRow.append(element('th', { text: label })));
  head.append(headRow);
  const body = element('tbody');

  matches.forEach((match) => {
    const row = element('tr');
    const matchLink = element('a', {
      className: 'match-link',
      text: match.match_id,
      attrs: { href: `/api/matches/${encodeURIComponent(match.match_id)}` },
    });
    const radiantName = match.radiant_team_name || `Team ${match.radiant_team_id || '?'}`;
    const direName = match.dire_team_name || `Team ${match.dire_team_id || '?'}`;
    const winner = element('span', {
      className: `winner ${match.radiant_win ? 'radiant' : 'dire'}`,
      text: match.radiant_win ? 'Radiant' : 'Dire',
    });
    addCell(row, '比赛 ID', matchLink);
    addCell(row, 'Radiant', radiantName, 'radiant');
    addCell(row, 'Dire', direName, 'dire');
    addCell(row, '胜方', winner);
    addCell(row, '比分', `${match.radiant_score ?? '—'} – ${match.dire_score ?? '—'}`, 'mono');
    addCell(row, '时长', formatDuration(match.duration), 'mono');
    addCell(row, '赛事', match.league_name || (match.leagueid ? `League ${match.leagueid}` : '—'));
    addCell(row, '日期', formatDate(match.start_time));
    body.append(row);
  });

  table.append(head, body);
  scroll.append(table);
  const pagination = element('nav', { className: 'pagination', attrs: { 'aria-label': '比赛分页' } });
  const meta = payload.pagination || { page, total_pages: page, total: matches.length };
  pagination.append(element('span', { text: `第 ${meta.page} / ${meta.total_pages} 页，共 ${meta.total} 场` }));
  [
    ['首页', 1, page <= 1],
    ['上一页', page - 1, page <= 1],
    ['下一页', page + 1, page >= meta.total_pages],
    ['末页', meta.total_pages, page >= meta.total_pages],
  ].forEach(([label, target, disabled]) => {
    const button = element('button', { text: label, attrs: { type: 'button' } });
    button.disabled = Boolean(disabled);
    button.addEventListener('click', () => goToPage(Number(target)));
    pagination.append(button);
  });
  content.replaceChildren(scroll, pagination);
}

function goToPage(target) {
  page = Math.max(1, target);
  void loadMatches();
}

document.getElementById('filters-form').addEventListener('submit', (event) => {
  event.preventDefault();
  page = 1;
  void loadMatches();
});
void loadMatches();
</script>
</body>
</html>
