<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dota 2 Monitor Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="options.heading">Monitor Settings</h1>
    </header>
    <section>
      <div class="select-row">
        <label for="languageSelect" data-i18n="language.label">Language</label>
        <select id="languageSelect">
          <option value="zh-CN" data-i18n="language.zh-CN">Simplified Chinese</option>
          <option value="en" data-i18n="language.en">English</option>
        </select>
      </div>
    </section>
    <section>
      <h2 data-i18n="options.capture">Capture</h2>
      <label class="check-row"><input id="ray086Enabled" type="checkbox"> <span data-i18n="options.raybetSite">RayBet site</span></label>
      <label class="check-row"><input id="raylinksEnabled" type="checkbox"> <span data-i18n="options.raybetApis">RayBet market APIs</span></label>
    </section>
    <footer><button id="saveButton" type="button" data-i18n="options.save">Save</button><span id="saveMessage" role="status"></span></footer>
  </main>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
