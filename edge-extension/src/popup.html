<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dota 2 Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1 data-i18n="popup.heading">Dota 2 Monitor</h1>
      <p id="stateLine"><span id="stateDot"></span><span id="stateText" data-i18n="common.loading">Loading</span></p>
    </div>
    <button id="openOptions" class="icon-button" type="button" title="Settings" aria-label="Settings"
      data-i18n-title="popup.settings" data-i18n-aria-label="popup.settings">&#9881;</button>
  </header>
  <main>
    <div class="select-row">
      <label for="languageSelect" data-i18n="language.label">Language</label>
      <select id="languageSelect">
        <option value="zh-CN" data-i18n="language.zh-CN">Simplified Chinese</option>
        <option value="en" data-i18n="language.en">English</option>
      </select>
    </div>
    <label class="toggle-row">
      <span data-i18n="popup.capture">Capture</span>
      <input id="captureToggle" type="checkbox" role="switch">
    </label>
    <dl>
      <div><dt data-i18n="popup.companion">Companion</dt><dd id="companionValue" data-i18n="common.checking">Checking</dd></div>
      <div><dt data-i18n="popup.dotaMatches">Dota matches</dt><dd id="matchCount">0</dd></div>
      <div><dt data-i18n="popup.queued">Queued</dt><dd id="queueCount">0</dd></div>
      <div><dt data-i18n="popup.dropped">Dropped</dt><dd id="dropCount">0</dd></div>
      <div><dt data-i18n="popup.lastEvent">Last event</dt><dd id="lastEvent" data-i18n="common.none">None</dd></div>
      <div><dt data-i18n="popup.pageHook">Page hook</dt><dd id="hookStatus" data-i18n="common.notSeen">Not seen</dd></div>
      <div><dt data-i18n="popup.bridge">Bridge</dt><dd id="bridgeStatus" data-i18n="common.notSeen">Not seen</dd></div>
      <div><dt data-i18n="popup.observed">Observed</dt><dd id="observedCount">F 0 | X 0 | W 0</dd></div>
      <div><dt data-i18n="popup.classified">Classified</dt><dd id="classifiedCount">0 accepted | 0 ignored</dd></div>
      <div><dt data-i18n="popup.lastRequest">Last request</dt><dd id="lastObserved" data-i18n="common.none">None</dd></div>
      <div><dt data-i18n="popup.lastDecision">Last decision</dt><dd id="lastDecision" data-i18n="common.none">None</dd></div>
    </dl>
    <a id="reportLink" class="report-link" href="#" hidden data-i18n="popup.openReport">Open shadow report</a>
  </main>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
