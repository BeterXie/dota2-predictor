name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dota2_predictor
          POSTGRES_USER: dota2
          POSTGRES_PASSWORD: dota2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dota2 -d dota2_predictor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dota2:dota2_ci@localhost:5432/dota2_predictor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest ruff==0.15.21
      - run: alembic upgrade head
      - run: ruff check database fetch scripts/migrate_sqlite_to_postgres.py tests/integration/postgres
      - run: python -m pytest tests/integration/postgres -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
